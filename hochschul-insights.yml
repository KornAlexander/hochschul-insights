name: Hochschul-Insights (German Higher Education)
description: >
  End-to-end analytics on German higher-education data from DESTATIS GENESIS-Online:
  students, staff, third-party funding, expenses, income — 10 fact + 6 dimension
  tables, Direct Lake semantic model, 8-page IBCS-styled Power BI report with an
  Azure Map of all 422 Hochschulen, plus a Data Agent for natural-language Q&A.
  Bundled snapshot included for zero-config deploy; live refresh optional via a
  free DESTATIS GENESIS API token.
